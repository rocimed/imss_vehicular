<div class="p-6">
    <h2 class="text-xl font-semibold mb-4">Configuraciones del Sistema</h2>
  
    <div class="flex gap-4 mb-6">
      <button (click)="cambiarSeccion('usuarios')" [ngClass]="{
        'bg-blue-500 text-white': seccionActiva === 'usuarios',
        'bg-gray-100': seccionActiva !== 'usuarios'
      }" class="px-4 py-2 rounded border">Usuarios</button>
  
      <button (click)="cambiarSeccion('vehiculos')" [ngClass]="{
        'bg-blue-500 text-white': seccionActiva === 'vehiculos',
        'bg-gray-100': seccionActiva !== 'vehiculos'
      }" class="px-4 py-2 rounded border">Vehículos</button>

     <button (click)="cambiarSeccion('pliego-comision')" [ngClass]="{
      'bg-blue-500 text-white': seccionActiva === 'pliego-comision',
       'bg-gray-100': seccionActiva !== 'pliego-comision'
      }" class="px-4 py-2 rounded border">Pliego Comision</button>

       <button (click)="cambiarSeccion('informecomision')" [ngClass]="{
        'bg-blue-500 text-white': seccionActiva === 'informecomision',
         'bg-gray-100': seccionActiva !== 'informecomision'
        }" class="px-4 py-2 rounded border">Informe de Comision</button>
    </div>

  
    <!-- USUARIOS -->
    <div *ngIf="seccionActiva === 'usuarios'">
      <div class="flex justify-end mb-4">
        <button class="bg-green-500 text-white px-4 py-2 rounded" (click)="agregarUsuario()">Agregar Usuario</button>
      </div>
  
      <div *ngIf="mostrarFormularioUsuario" class="mb-4 p-4 border rounded bg-gray-50">
        <h3 class="text-lg font-semibold mb-2">Nuevo Usuario</h3>
        <input type="text" placeholder="Nombre" [(ngModel)]="nuevoUsuario.nombre"
               class="block mb-2 p-2 border rounded w-full" />
        <input type="text" placeholder="Matrícula" [(ngModel)]="nuevoUsuario.matricula"
               class="block mb-2 p-2 border rounded w-full" />
        <input type="text" placeholder="CURP" [(ngModel)]="nuevoUsuario.curp"
               class="block mb-2 p-2 border rounded w-full" />
        <input type="text" placeholder="RFC" [(ngModel)]="nuevoUsuario.rfc"
               class="block mb-2 p-2 border rounded w-full" />
        <input type="text" placeholder="Tipo" [(ngModel)]="nuevoUsuario.tipo"
               class="block mb-2 p-2 border rounded w-full"/>
               <label class="block mb-1 font-medium">Tipo de Rol Asignado</label>
               <select [(ngModel)]="nuevoUsuario.asignacion" class="block mb-4 p-2 border rounded w-full">
                 <option value="">Seleccione una opción</option>
                 <option value="14000">Administrador</option>
                 <option value="9000">subAdministrador</option>
                 <option value="4000">operador</option>
                 <option value="4000">Administrativo</option>
               </select>
        <button (click)="guardarUsuario()" class="bg-blue-600 text-white px-4 py-2 rounded">Guardar</button>
      </div>
  
      <app-usuarios></app-usuarios>
    </div>
  
    <!-- VEHÍCULOS -->
    <div *ngIf="seccionActiva === 'vehiculos'">
      <div class="flex justify-end mb-4">
        <button class="bg-green-500 text-white px-4 py-2 rounded" (click)="agregarVehiculo()">Agregar Vehículo</button>
      </div>
  
      <div *ngIf="mostrarFormularioVehiculo" class="mb-4 p-4 border rounded bg-gray-50">
        <h3 class="text-lg font-semibold mb-2">Nuevo Vehículo</h3>
        <input type="text" placeholder="Tipo" [(ngModel)]="nuevoVehiculo.tipo"
               class="block mb-2 p-2 border rounded w-full" />
        <input type="text" placeholder="Placas" [(ngModel)]="nuevoVehiculo.placas"
               class="block mb-2 p-2 border rounded w-full" />
        <input type="text" placeholder="Marca" [(ngModel)]="nuevoVehiculo.modelo"
               class="block mb-2 p-2 border rounded w-full" />
        <input type="text" placeholder="ECCO" [(ngModel)]="nuevoVehiculo.ecco"
               class="block mb-2 p-2 border rounded w-full" />
        <input type="text" placeholder="Kilometraje Actual" [(ngModel)]="nuevoVehiculo.actualKilometraje"
               class="block mb-2 p-2 border rounded w-full" />
               <label class="block mb-1 font-medium">Próximo Servicio</label>
               <select [(ngModel)]="nuevoVehiculo.proximoServicio" class="block mb-4 p-2 border rounded w-full">
                 <option value="">Seleccione una opción</option>
                 <option value="14000">14,000 km</option>
                 <option value="9000">9,000 km</option>
                 <option value="4000">4,000 km</option>
               </select>
        <button (click)="guardarVehiculo()" class="bg-blue-600 text-white px-4 py-2 rounded">Guardar</button>
      </div>
  
      <app-vehiculo></app-vehiculo>
    </div>
  </div>
